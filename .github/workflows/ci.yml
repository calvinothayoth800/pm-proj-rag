name: CI - Test & Validate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Prepare corpus artifacts
      run: |
        if [ -f "data/processed/chunks-latest.json" ]; then
          echo "Processed chunks found"
        else
          echo "Processed chunks not found, running ingestion..."
          python scripts/ingest.py
        fi

        if [ -f "data/indexes/faiss_index.bin" ]; then
          echo "FAISS index found"
        else
          echo "FAISS index not found, building..."
          python scripts/build_index.py
        fi

    - name: Run tests
      run: |
        python -m unittest discover -s tests -v

    - name: Test summary
      if: always()
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "All tests executed successfully!" >> $GITHUB_STEP_SUMMARY
